services:
  - type: web
    name: rhythm-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER
        value: "true"
      - key: SAAVN_BASE_URL
        value: https://saavn.sumit.co
      - key: HOME_CACHE_TTL_SECONDS
        value: "86400"
      - key: GRPC_DNS_RESOLVER
        value: native
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
    secretFiles:
      - name: firebase-service-account.json
        mountPath: /etc/secrets/firebase-service-account.json

