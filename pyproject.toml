[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    "venv",
    ".venv",
    "credentials",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length
    "B008", # fastapi Depends/Query in function params
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018", "C401", "F841"]
